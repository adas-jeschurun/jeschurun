<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jeschurun</title>
    <meta
      name="description"
      content="Torah journal of Adas Jeschurun in Haifa — teachings of Rabbi Samson Raphael Hirsch and those who continue his path."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Shell CSS before JS — Layout paints without waiting for the CSS bundle. -->
    <style id="jes-shell-css">
      :root {
        --ink: #1a1f26;
        --blue: #1a3d67;
        --blue-dark: #163653;
        --gold: #d8bb63;
        --line: #d5dde6;
        --paper: #f7f4ef;
        --paper-2: #efe8dc;
        --font-display: Georgia, "Times New Roman", serif;
        --font-body: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; min-height: 100%; }
      body {
        font-family: var(--font-body);
        color: var(--ink);
        background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
      }
      .site { padding: 0 0 48px; }
      .site-body { max-width: 980px; margin: 0 auto; padding: 0 16px; }
      .site-header {
        background: var(--blue);
        color: #f7f4ed;
        text-align: center;
        padding: 10px 16px 12px;
        border-bottom: 3px solid var(--gold);
      }
      .page-main { min-height: 40vh; padding: 8px 0 24px; }
      .main-nav.top-bar {
        display: flex; gap: 4px; padding: 8px;
        background: rgba(247, 244, 239, 0.96);
        border: 1px solid var(--line); border-radius: 8px;
        justify-content: center; flex-wrap: wrap;
      }
      .skeleton-line {
        height: 14px; margin: 8px 0; border-radius: 4px;
        background: linear-gradient(90deg, #e8e2d6 25%, #f3eee4 50%, #e8e2d6 75%);
        background-size: 200% 100%;
      }
      .skeleton-line--title { height: 28px; width: 70%; }
      .skeleton-line--sub { width: 45%; }
      .skeleton-line--short { width: 35%; }
      .skeleton-card { padding: 12px 0; border-bottom: 1px solid var(--line); }
    </style>
    <!-- Fallback when edge does not embed catalog (local vite). Dropped on apex. -->
    <link rel="preload" href="/api/content" as="fetch" crossorigin="anonymous" />
    <script>
      (function () {
        var m = location.pathname.match(
          /^\/(he|en|ru|de|fr)\/(article|answer|biography)\/([^/]+)/,
        );
        if (!m) return;
        var kind = m[2] === "biography" ? "bio" : m[2];
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "fetch";
        link.crossOrigin = "anonymous";
        link.href =
          "/api/material?kind=" +
          encodeURIComponent(kind) +
          "&slug=" +
          encodeURIComponent(m[3]) +
          "&lang=" +
          encodeURIComponent(m[1]);
        document.head.appendChild(link);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      />
    </noscript>
    <script id="jes-a11y-bootstrap">
      (function () {
        try {
          var a = localStorage.getItem("jes-a11y");
          if (!a) return;
          var s = JSON.parse(a),
            r = document.documentElement,
            f = [
              "a11y-font--2",
              "a11y-font--1",
              "",
              "a11y-font-1",
              "a11y-font-2",
              "a11y-font-3",
              "a11y-font-4",
            ],
            cb = ["protanopia", "deuteranopia", "tritanopia"],
            fs = Math.round(Number(s.fontScale) || 0);
          if (fs < -2) fs = -2;
          if (fs > 4) fs = 4;
          var lh = Math.round(Number(s.lineHeight) || 0);
          if (lh < 0) lh = 0;
          if (lh > 3) lh = 3;
          var ls = Math.round(Number(s.letterSpacing) || 0);
          if (ls < 0) ls = 0;
          if (ls > 3) ls = 3;
          f.filter(Boolean).forEach(function (c) {
            r.classList.remove(c);
          });
          if (fs) {
            var fc = f[fs + 2];
            if (fc) r.classList.add(fc);
          }
          ["a11y-line-1", "a11y-line-2", "a11y-line-3"].forEach(function (c) {
            r.classList.remove(c);
          });
          if (lh > 0) r.classList.add("a11y-line-" + lh);
          ["a11y-spacing-1", "a11y-spacing-2", "a11y-spacing-3"].forEach(
            function (c) {
              r.classList.remove(c);
            },
          );
          if (ls > 0) r.classList.add("a11y-spacing-" + ls);
          r.classList.toggle("a11y-high-contrast", !!s.highContrast);
          r.classList.toggle("a11y-monochrome", !!s.monochrome);
          r.classList.toggle("a11y-highlight-links", !!s.highlightLinks);
          r.classList.toggle("a11y-highlight-headings", !!s.highlightHeadings);
          r.classList.toggle("a11y-pause-animations", !!s.pauseAnimations);
          r.classList.toggle("a11y-big-cursor", !!s.bigCursor);
          r.classList.toggle("a11y-readable-font", !!s.readableFont);
          cb.forEach(function (c) {
            r.classList.remove("a11y-" + c);
          });
          if (cb.indexOf(s.colorBlind) >= 0) r.classList.add("a11y-" + s.colorBlind);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
