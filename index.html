<title>Jeschurun</title>
<script>
(function(){
  var lang=(navigator.language||navigator.userLanguage||"en").toLowerCase();
  if(lang.indexOf("he")===0){ location.replace("./he/"); }
  else if(lang.indexOf("ru")===0){ location.replace("./ru/"); }
  else if(lang.indexOf("de")===0){ location.replace("./de/"); }
  else if(lang.indexOf("fr")===0){ location.replace("./fr/"); }
  else { location.replace("./en/"); }
})();
</script>
